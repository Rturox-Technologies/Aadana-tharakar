# ============================================================
# Aadana Tharakar — Render Production Blueprint
# ============================================================
# This blueprint deploys Postgres, Redis, and the Java Backend
# automatically with one click.
# ============================================================

services:
  # ── Java Spring Boot Backend ──────────────────────────────
  - type: web
    name: aadana-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free # Can be upgraded later
    port: 8080
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: aadana-postgres
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        fromDatabase:
          name: aadana-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: aadana-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aadana-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: aadana-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: aadana-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: aadana-redis
          property: password
      - key: JWT_SECRET
        generateValue: true # Generates a secure random 256-bit token automatically!
      - key: CORS_ALLOWED_ORIGINS
        value: https://aadanatharakar.com,http://localhost:3000
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Put your Cloudinary Cloud Name in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Put your Cloudinary API Key in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Put your Cloudinary API Secret in Render dashboard

databases:
  # ── PostgreSQL Database ──────────────────────────────────
  - name: aadana-postgres
    plan: free
    postgresMajorVersion: 16

interfaces:
  # ── Upstash Serverless Redis ──────────────────────────────
  - type: redis
    name: aadana-redis
    plan: free
    ipAllowList: [] # Security: Allow connections only from services in the blueprint
