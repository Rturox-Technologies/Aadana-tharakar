server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: nilamnai-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

  # PostgreSQL Database Connection
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nilamnai_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis — Caching, Rate Limiting & Token Blacklist
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  # Spring Cache — uses Redis
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes default TTL

# ── JWT Security Configuration ────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:your_super_secret_signing_key_containing_at_least_256_bits_for_security_compliance}
    # Access token: 15 minutes (production security hardening)
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    # Refresh token: 7 days — stored and validated in Redis
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  # Security — CORS & Rate Limiting
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Cloudinary Media Storage ──────────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

# ── Legacy CORS key (backwards-compat with CorsConfig.java) ──────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
